name: CI

on:
  push:
    branches: [main, 'release/**']
    paths-ignore: &docs-only
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
  pull_request:
    branches: [main, 'release/**']
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (check, vitest, build)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions in all manifests agree
        run: node scripts/version.mjs check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  sidecar:
    name: Sidecar (pytest)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install KoSIT validator
        run: tools/download-validator.sh
      - working-directory: sidecar
        run: |
          pip install -r requirements.txt
          pip install 'pytest>=8.0' 'pytest-cov>=5.0'
          pytest -ra

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      # Tauri Linux build deps — required even for lib tests because tauri-build
      # links against system libs at compile-time.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      # tauri-build verifies every bundle.resources path at compile time. The
      # production resources live in tauri.bundle.conf.json, but stub them so
      # the job never depends on the PyInstaller + jlink pipeline from build.yml.
      - name: Stub bundle resources
        run: |
          mkdir -p sidecar/dist tools/kosit-validator tools/jre/bin
          touch sidecar/dist/zettel-sidecar
          touch tools/kosit-validator/validator.jar
          touch tools/kosit-validator/scenarios.xml
          touch tools/jre/bin/java
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked

  # Single required check for branch protection, independent of job renames.
  ci-ok:
    name: CI ok
    if: always()
    needs: [frontend, sidecar, rust]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
