name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Release gate for tags: the tag must match the version in every manifest; a
  # pre-release tag (vX.Y.Z-rc.N) must point at a commit on release/vX.Y, a
  # stable tag at a commit on main.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify ref
        id: kind
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag matches app version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs check "$TAG"

      - name: Tag sits on its branch (pre-release → release/vX.Y, stable → main)
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            MINOR="$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/')"
            BRANCH="release/v${MINOR}"
          else
            BRANCH=main
          fi
          git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" \
            || { echo "::error::Branch ${BRANCH} existiert nicht auf origin."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${BRANCH}" \
            || { echo "::error::${TAG} zeigt nicht auf einen Commit in ${BRANCH}."; exit 1; }

  build:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: zettel-windows-x86_64
          - os: macos-15
            rust-target: aarch64-apple-darwin
            artifact-name: zettel-macos-arm64
          # macOS Intel (macos-13) bewusst deaktiviert: GitHub-Actions-Free-Tier
          # liefert Intel-Runner derzeit nur mit 1h+ Queue-Zeit. Apple-Silicon
          # deckt 2025+ den Großteil der Zielgruppe. Wieder reinholen via
          # workflow_dispatch oder neue Matrix-Zeile, sobald das Capacity-Thema
          # entspannt ist (oder ein User explizit Intel braucht).
          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: zettel-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # ---------- System deps (per OS) ----------

      - name: Install Linux build deps (WebKit, GTK, Cairo, Pango)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libffi-dev libssl-dev pkg-config

      - name: Install macOS WeasyPrint deps
        if: startsWith(matrix.os, 'macos')
        run: brew install pango gdk-pixbuf libffi cairo

      - name: Install GTK3 runtime (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $url = "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe"
          $exe = "$env:RUNNER_TEMP\gtk-runtime.exe"
          # Download with a per-attempt timeout + retries. A bare Invoke-WebRequest
          # has no timeout and can stall forever on a flaky CDN connection — that
          # was hanging the whole release build.
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $exe -TimeoutSec 120
              if ((Test-Path $exe) -and (Get-Item $exe).Length -gt 1MB) { $ok = $true; break }
            } catch { Write-Host "GTK download attempt $i failed: $_" }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw "GTK runtime download failed after 4 attempts" }
          # Silent install, but never wait forever — kill + fail if it stalls.
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "GTK installer timed out" }
          echo "C:\Program Files\GTK3-Runtime Win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ---------- Toolchains ----------

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---------- Build sidecar ----------

      - name: Install Python sidecar deps
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build sidecar (PyInstaller)
        working-directory: sidecar
        run: python build.py

      # ---------- Build bundled validator + JRE ----------

      - name: Download KoSIT validator
        shell: bash
        run: tools/download-validator.sh

      - name: Build jlink-minimized JRE
        shell: bash
        run: tools/build-jre.sh

      # ---------- Build frontend + Tauri ----------

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Linux — .deb only)
        if: matrix.os == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.rust-target }} --bundles deb,updater

      # MSI (WiX) rejects non-numeric pre-release versions such as 0.23.0-rc.1,
      # so release candidates ship the NSIS installer only — it is also what
      # the updater installs.
      - name: Build Tauri app (Windows release candidate — NSIS only)
        if: matrix.os == 'windows-latest' && needs.prepare.outputs.prerelease == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.rust-target }} --bundles nsis

      - name: Build Tauri app
        if: matrix.os != 'ubuntu-22.04' && !(matrix.os == 'windows-latest' && needs.prepare.outputs.prerelease == 'true')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.rust-target }}

      # ---------- Upload ----------

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi.sig
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe.sig
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage.sig
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
          if-no-files-found: warn

  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Build latest.json (updater feed)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          read_sig() { [ -f "$1" ] && cat "$1" || echo ""; }

          # Windows (Tauri 2 with createUpdaterArtifacts): NSIS -setup.exe is signed directly, sig sits next to it.
          WIN_SIG_FILE="$(find dist/zettel-windows-x86_64 -name '*-setup.exe.sig' | head -n1 || true)"
          WIN_EXE="$(find dist/zettel-windows-x86_64 -name '*-setup.exe' ! -name '*.sig' | head -n1 || true)"
          WIN_SIG="$(read_sig "$WIN_SIG_FILE")"
          WIN_URL=""
          if [ -n "$WIN_EXE" ]; then
            WIN_URL="https://github.com/${REPO}/releases/download/${TAG}/$(basename "$WIN_EXE")"
          fi

          MAC_SIG_FILE="$(find dist/zettel-macos-arm64 -name '*.app.tar.gz.sig' | head -n1 || true)"
          MAC_TARBALL="$(find dist/zettel-macos-arm64 -name '*.app.tar.gz' ! -name '*.sig' | head -n1 || true)"
          MAC_SIG="$(read_sig "$MAC_SIG_FILE")"
          MAC_URL=""
          if [ -n "$MAC_TARBALL" ]; then
            MAC_URL="https://github.com/${REPO}/releases/download/${TAG}/$(basename "$MAC_TARBALL")"
          fi

          # Linux: AppImage updater. .deb-only builds won't produce one — left empty if missing.
          LIN_SIG_FILE="$(find dist/zettel-linux-x86_64 -name '*.AppImage.sig' | head -n1 || true)"
          LIN_APPIMAGE="$(find dist/zettel-linux-x86_64 -name '*.AppImage' ! -name '*.sig' | head -n1 || true)"
          LIN_SIG="$(read_sig "$LIN_SIG_FILE")"
          LIN_URL=""
          if [ -n "$LIN_APPIMAGE" ]; then
            LIN_URL="https://github.com/${REPO}/releases/download/${TAG}/$(basename "$LIN_APPIMAGE")"
          fi

          export VERSION PUB_DATE WIN_SIG WIN_URL MAC_SIG MAC_URL LIN_SIG LIN_URL TAG REPO
          python3 - <<'PY' > latest.json
          import json, os
          platforms = {}
          if os.environ.get("WIN_URL"):
              platforms["windows-x86_64"] = {"signature": os.environ.get("WIN_SIG", ""), "url": os.environ["WIN_URL"]}
          if os.environ.get("MAC_URL"):
              platforms["darwin-aarch64"] = {"signature": os.environ.get("MAC_SIG", ""), "url": os.environ["MAC_URL"]}
          if os.environ.get("LIN_URL"):
              platforms["linux-x86_64"] = {"signature": os.environ.get("LIN_SIG", ""), "url": os.environ["LIN_URL"]}
          print(json.dumps({
              "version": os.environ["VERSION"],
              "notes": f"See https://github.com/{os.environ['REPO']}/releases/tag/{os.environ['TAG']}",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": platforms,
          }, indent=2))
          PY
          cat latest.json

      # Always a draft: publishing by hand is the release gate. Publishing then
      # triggers update-feed.yml, which moves the beta channel feed. A
      # pre-release never becomes "latest", so stable clients never see it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*
            latest.json
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
